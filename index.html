<!DOCTYPE html>
<html lang="gu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Partner Bill Kharcha</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1f3a5f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Partner Bill">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f4f6f8;color:#202124}
header{background:#1f3a5f;color:#fff;padding:18px 15px;text-align:center}
header h1{margin:0;font-size:22px} header p{margin:6px 0 0;font-size:13px;opacity:.9}
.wrap{max-width:900px;margin:auto;padding:14px}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.card{background:#fff;border-radius:14px;padding:15px;box-shadow:0 2px 10px #0001}
.card h2{margin:0 0 8px;font-size:18px}.total{font-size:22px;font-weight:bold}
.karan .total{color:#1769aa}.rohit .total{color:#7b3fb5}
.form{background:#fff;border-radius:14px;padding:15px;box-shadow:0 2px 10px #0001;margin-bottom:14px}
.form h3{margin:0 0 12px}.row{display:grid;grid-template-columns:150px 1fr 150px;gap:10px}
input,button,select{font:inherit}input,select{width:100%;padding:11px 10px;border:1px solid #d5d9de;border-radius:9px}
button{border:0;border-radius:9px;padding:11px 15px;font-weight:bold;cursor:pointer}
.primary{background:#1f3a5f;color:#fff}.danger{background:#d9534f;color:#fff}.light{background:#e9edf2;color:#202124}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}.tab{background:#e9edf2}.tab.active{background:#193b78;color:#fff}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.filters{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.summaryline{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid #eee}
.tablewrap{overflow:auto}.empty{padding:15px;text-align:center;color:#777}
table{width:100%;border-collapse:collapse;min-width:560px}
th,td{padding:9px;border-bottom:1px solid #eee;text-align:left}th{background:#f1f3f5}
td.amount{text-align:right;font-weight:bold}
@media(max-width:650px){.cards,.row,.filters{grid-template-columns:1fr}.wrap{padding:10px}.cards{gap:8px}}
</style>
</head>
<body>
<header><h1>Partner Bill Kharcha</h1><p>Karanbhai & Rohitbhai — ખર્ચનો સરળ હિસાબ</p></header>
<div class="wrap">
  <div class="cards">
    <div class="card karan"><h2>👤 Karanbhai</h2><div class="total" id="karanTotal">₹0</div><div id="karanCount">0 bills</div></div>
    <div class="card rohit"><h2>👤 Rohitbhai</h2><div class="total" id="rohitTotal">₹0</div><div id="rohitCount">0 bills</div></div>
  </div>

  <div class="form">
    <div class="tabs">
      <button class="tab active" id="tabKaran" onclick="setPartner('Karanbhai')">Karanbhai List</button>
      <button class="tab" id="tabRohit" onclick="setPartner('Rohitbhai')">Rohitbhai List</button>
    </div>
    <h3 id="formTitle">➕ Karanbhai નો ખર્ચ ઉમેરો</h3>
    <div class="row">
      <input id="date" type="date">
      <input id="party" type="text" placeholder="Party name (જેમ કે Stitching)">
      <input id="amount" type="number" min="0" step="0.01" placeholder="Amount ₹">
    </div>
    <div class="actions">
      <button class="primary" onclick="addEntry()">➕ ખર્ચ ઉમેરો</button>
      <button class="light" onclick="setToday()">આજની તારીખ</button>
    </div>
  </div>

  <div class="form">
    <h3>📊 Reports & Filters</h3>
    <div class="filters">
      <select id="monthFilter" onchange="render()"><option value="">બધા મહિના</option></select>
      <input id="partyFilter" type="text" placeholder="Party શોધો..." oninput="render()">
      <select id="partnerFilter" onchange="render()">
        <option value="">બધા Partner</option><option>Karanbhai</option><option>Rohitbhai</option>
      </select>
    </div>
    <div class="actions">
      <button class="primary" onclick="exportCSV()">⬇️ CSV Export</button>
      <button class="light" onclick="exportFilteredCSV()">⬇️ Filtered CSV</button>
      <button class="light" onclick="printReport()">🖨️ Print / PDF</button>
      <button class="danger" onclick="clearAll()">🗑️ બધો Data Delete</button>
    </div>
  </div>

  <div class="card">
    <h3>💰 Grand Total: <span id="grandTotal">₹0</span></h3>
    <h3>🏷️ Party-wise Total</h3>
    <div id="partyRows"></div>
  </div>

  <div class="form">
    <h3>📋 ખર્ચની વિગતો</h3>
    <div class="tablewrap">
      <table>
        <thead><tr><th>Date</th><th>Partner</th><th>Party</th><th>Amount</th><th></th></tr></thead>
        <tbody id="listRows"></tbody>
      </table>
    </div>
  </div>
</div>

<script>
let partner='Karanbhai';
let data=JSON.parse(localStorage.getItem('partner_bill_kharcha_data')||'[]');

function money(n){return '₹'+Number(n||0).toLocaleString('en-IN',{maximumFractionDigits:2})}
function formatDate(s){if(!s)return '';const p=s.split('-');return p[2]+'-'+p[1]+'-'+p[0]}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function save(){localStorage.setItem('partner_bill_kharcha_data',JSON.stringify(data));render()}

const API_URL = "https://script.google.com/macros/s/AKfycbyP9ZBCm8huPDMvqjjX7dY-E9PQBoGVQ3iUPLxSqABdI7EhYSb5EcPpT-Xl-8cWBGVH/exec";

async function apiRequest(action, payload={}) {
  if (!API_URL) return null;
  const url = API_URL + "?action=" + encodeURIComponent(action);
  const res = await fetch(url, {
    method: "POST",
    headers: {"Content-Type":"text/plain;charset=utf-8"},
    body: JSON.stringify(payload)
  });
  if (!res.ok) throw new Error("Network error");
  return await res.json();
}

async function syncFromServer(showError=false) {
  if (!API_URL) return;
  try {
    const result = await apiRequest("list");
    if (result && Array.isArray(result.data)) {
      data = result.data;
      localStorage.setItem('partner_bill_kharcha_data', JSON.stringify(data));
      render();
    }
  } catch(e) {
    if (showError) alert("Online sync failed. Internet/backend check કરો.");
  }
}

async function pushEntry(entry) {
  if (!API_URL) return;
  try { await apiRequest("add", entry); await syncFromServer(); }
  catch(e) { alert("Entry save થઈ નથી. Internet/backend check કરો."); }
}

async function pushDelete(id) {
  if (!API_URL) return;
  try { await apiRequest("delete", {id}); await syncFromServer(); }
  catch(e) { alert("Delete sync થઈ નથી."); }
}

function setToday(){document.getElementById('date').value=new Date().toISOString().slice(0,10)}
function setPartner(p){
  partner=p;
  document.getElementById('formTitle').textContent='➕ '+p+' નો ખર્ચ ઉમેરો';
  document.getElementById('tabKaran').classList.toggle('active',p==='Karanbhai');
  document.getElementById('tabRohit').classList.toggle('active',p==='Rohitbhai');
}
async function addEntry(){
  const date=document.getElementById('date').value;
  const party=document.getElementById('party').value.trim();
  const amount=Number(document.getElementById('amount').value);
  if(!date||!party||!amount||amount<0){alert('Date, Party અને Amount ભરો.');return}
  const entry={id:String(Date.now()+Math.random()),date,party,amount,partner};
  data.push(entry);
  document.getElementById('party').value='';
  document.getElementById('amount').value='';
  save();
  await pushEntry(entry);
}
async function deleteEntry(id){
  if(confirm('આ ખર્ચ delete કરવો છે?')){data=data.filter(x=>x.id!==id);save();await pushDelete(id)}
}
function getFilteredData(){
  const month=document.getElementById('monthFilter').value;
  const pf=document.getElementById('partyFilter').value.trim().toLowerCase();
  const p=document.getElementById('partnerFilter').value;
  return data.filter(x=>{
    return (!month||x.date.startsWith(month)) &&
           (!pf||x.party.toLowerCase().includes(pf)) &&
           (!p||x.partner===p);
  });
}
function renderMonths(){
  const sel=document.getElementById('monthFilter'), old=sel.value;
  const months=[...new Set(data.map(x=>x.date.slice(0,7)))].sort().reverse();
  sel.innerHTML='<option value="">બધા મહિના</option>'+months.map(m=>'<option value="'+m+'">'+m+'</option>').join('');
  if(months.includes(old))sel.value=old;
}
function render(){
  renderMonths();
  const arr=getFilteredData();
  const kt=data.filter(x=>x.partner==='Karanbhai').reduce((a,x)=>a+x.amount,0);
  const rt=data.filter(x=>x.partner==='Rohitbhai').reduce((a,x)=>a+x.amount,0);
  document.getElementById('karanTotal').textContent=money(kt);
  document.getElementById('rohitTotal').textContent=money(rt);
  document.getElementById('karanCount').textContent=data.filter(x=>x.partner==='Karanbhai').length+' bills';
  document.getElementById('rohitCount').textContent=data.filter(x=>x.partner==='Rohitbhai').length+' bills';
  const gt=arr.reduce((a,x)=>a+x.amount,0);
  document.getElementById('grandTotal').textContent=money(gt);

  const rows=[...arr].sort((a,b)=>b.date.localeCompare(a.date));
  document.getElementById('listRows').innerHTML=rows.length?rows.map(x=>
    '<tr><td>'+formatDate(x.date)+'</td><td>'+escapeHtml(x.partner)+'</td><td>'+escapeHtml(x.party)+'</td><td class="amount">'+money(x.amount)+'</td><td><button class="danger" onclick="deleteEntry('+x.id+')">Delete</button></td></tr>'
  ).join(''):'<tr><td colspan="5" class="empty">હજુ કોઈ ખર્ચ નથી.</td></tr>';

  const map={};
  arr.forEach(x=>{
    if(!map[x.party])map[x.party]={Karanbhai:0,Rohitbhai:0,total:0};
    map[x.party][x.partner]+=x.amount;map[x.party].total+=x.amount;
  });
  const pr=Object.entries(map).sort((a,b)=>b[1].total-a[1].total);
  document.getElementById('partyRows').innerHTML=pr.length?pr.map(([name,v])=>
    '<div class="summaryline"><span>'+escapeHtml(name)+'</span><span>K: '+money(v.Karanbhai)+' &nbsp; R: '+money(v.Rohitbhai)+' &nbsp; <b>'+money(v.total)+'</b></span></div>'
  ).join(''):'<div class="empty">Party-wise data નથી.</div>';
}
function csvText(arr){
  return 'Partner,Date,Party,Amount\n'+arr.map(x=>x.partner+','+x.date+',"'+x.party.replace(/"/g,'""')+'",'+x.amount).join('\n');
}
function downloadCSV(text,name){
  const blob=new Blob([text],{type:'text/csv;charset=utf-8;'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
function exportCSV(){downloadCSV(csvText(data),'Partner_Bill_Kharcha.csv')}
function exportFilteredCSV(){downloadCSV(csvText(getFilteredData()),'Partner_Bill_Kharcha_Filtered.csv')}
function printReport(){
  const arr=[...getFilteredData()].sort((a,b)=>a.date.localeCompare(b.date));
  const kt=arr.filter(x=>x.partner==='Karanbhai').reduce((a,x)=>a+x.amount,0);
  const rt=arr.filter(x=>x.partner==='Rohitbhai').reduce((a,x)=>a+x.amount,0);
  const w=window.open('','_blank');
  if(!w){alert('Popup blocked છે. Browserમાં pop-up allow કરો.');return}
  w.document.open();
  w.document.write('<!doctype html><html><head><title>Partner Bill Kharcha Report</title><style>body{font-family:Arial;padding:25px}table{width:100%;border-collapse:collapse}th,td{border:1px solid #ccc;padding:8px}th{background:#eee}.tot{margin:12px 0;font-weight:bold}</style></head><body>');
  w.document.write('<h1>Partner Bill Kharcha Report</h1>');
  w.document.write('<div class="tot">Karanbhai: '+money(kt)+' &nbsp;&nbsp; Rohitbhai: '+money(rt)+' &nbsp;&nbsp; Grand Total: '+money(kt+rt)+'</div>');
  w.document.write('<table><thead><tr><th>Date</th><th>Partner</th><th>Party</th><th>Amount</th></tr></thead><tbody>');
  arr.forEach(x=>w.document.write('<tr><td>'+formatDate(x.date)+'</td><td>'+escapeHtml(x.partner)+'</td><td>'+escapeHtml(x.party)+'</td><td>'+money(x.amount)+'</td></tr>'));
  w.document.write('</tbody></table></body></html>');
  w.document.close();
  setTimeout(()=>w.print(),300);
}
function clearAll(){
  if(confirm('બધો data permanently clear કરવો છે?')){
    data=[];localStorage.removeItem('partner_bill_kharcha_data');render();
  }
}
setToday();render();syncFromServer(true);setInterval(()=>syncFromServer(false),10000);
</script>

<script>
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js'));
}
</script>
</body>
</html>
